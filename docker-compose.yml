services:
  servcrafty:
    # Released image; update with `docker compose pull && docker compose up -d`.
    # Pin a version with SERVCRAFTY_TAG=0.2.0. `docker compose build` still builds locally.
    image: ghcr.io/joaquincabrerasimoes/servcrafty:${SERVCRAFTY_TAG:-latest}
    build: .
    privileged: true            # required for the bundled Docker daemon (DinD)
    restart: unless-stopped
    ports:
      - "8080:8080"             # web UI
      - "25565-25600:25565-25600"   # game port pool (match PORT_POOL in admin settings)
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://servcrafty.joaquincabrerasimoes.com}
      TRUST_PROXY: ${TRUST_PROXY:-1}   # HTTPS is terminated by Cloudflare / reverse proxy
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
    volumes:
      - servcrafty-data:/data
      - servcrafty-docker:/var/lib/docker
volumes:
  servcrafty-data:
  servcrafty-docker:
